services:
  db:
    image: pgvector/pgvector:pg17
    container_name: chapterscope-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chapterscope}
      POSTGRES_USER: ${POSTGRES_USER:-chapterscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chapterscope_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
