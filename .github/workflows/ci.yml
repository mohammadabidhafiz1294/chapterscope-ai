name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: chapterscope
          POSTGRES_USER: chapterscope
          POSTGRES_PASSWORD: chapterscope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chapterscope -d chapterscope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: eduquantum.settings
      DEBUG: "True"
      SECRET_KEY: ci-only-secret
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://chapterscope:chapterscope@127.0.0.1:5432/chapterscope
      EMBEDDING_AUTO_INDEX: "false"
      GEMINI_API_KEY: ""
      CHAT_LLM_ENABLED: "false"
      GENERATION_LLM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r ../requirements-core.txt
      - run: pip install langchain-core langchain-google-genai sympy
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate
      - run: python manage.py test predictor

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false --passWithNoTests
      - run: npm run build
